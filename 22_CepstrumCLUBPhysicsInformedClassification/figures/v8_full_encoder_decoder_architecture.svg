<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1160" viewBox="0 0 2000 1160" role="img" aria-labelledby="title desc">
<title id="title">Full encoder and decoder architecture for click–channel decomposition</title><desc id="desc">Editable paper computation graph showing a shared convolutional frontend, independent click and channel encoders, progressive decoders, classifier, and causal reconstruction.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#3F4A54"/></marker><marker id="d" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#7A8793"/></marker><style>.bg{fill:#fff}.r{fill:#F7F9FA;stroke:#CAD3D8;stroke-width:1.4}.s{fill:#F3F5F6;stroke:#52616B;stroke-width:1.7}.x{fill:#EAF3FB;stroke:#0072B2;stroke-width:1.8}.h{fill:#EEF7F2;stroke:#009E73;stroke-width:1.8}.o{fill:#FFF8E8;stroke:#C58A00;stroke-width:1.8}.n{fill:#fff;stroke:#3F4A54;stroke-width:1.7}.l{fill:#F9EEF1;stroke:#B24C63;stroke-width:1.6}.p{fill:none;stroke:#3F4A54;stroke-width:2.1;marker-end:url(#a)}.q{fill:none;stroke:#7A8793;stroke-width:1.6;stroke-dasharray:6 5;marker-end:url(#d)}.t{font:700 27px Arial,sans-serif;fill:#1F2933}.k{font:700 15px Arial,sans-serif;letter-spacing:.8px;fill:#52616B}.b{font:700 16px Arial,sans-serif;fill:#1F2933}.m{font:16px Cambria,serif;fill:#1F2933}.z{font:12.5px Arial,sans-serif;fill:#44515C}.u{font:11px Arial,sans-serif;fill:#44515C}</style></defs>
<rect class="bg" width="2000" height="1160"/><text class="t" x="60" y="52">Full Encoder/Decoder architecture: click–channel decomposition with causal reconstruction</text><text class="z" x="60" y="78">Solid arrows: forward data flow. The branches share only the frontend; encoder and decoder parameters are independent thereafter.</text>
<rect class="r" x="45" y="112" width="390" height="805" rx="10"/><text class="k" x="65" y="143">INPUT AND SHARED FRONTEND</text><rect class="n" x="82" y="185" width="135" height="86" rx="8"/><text class="b" x="150" y="219" text-anchor="middle">Received waveform</text><text class="m" x="150" y="247" text-anchor="middle">r ∈ ℝ⁵⁷⁶¹</text>
<rect class="s" x="255" y="165" width="140" height="122" rx="8"/><text class="b" x="325" y="199" text-anchor="middle">Conv block 1</text><text class="z" x="325" y="224" text-anchor="middle">Conv1d 1→16, k=9</text><text class="z" x="325" y="244" text-anchor="middle">stride 4 · GN · GELU</text><text class="m" x="325" y="269" text-anchor="middle">16 × 1441</text>
<rect class="s" x="255" y="345" width="140" height="122" rx="8"/><text class="b" x="325" y="379" text-anchor="middle">Conv block 2</text><text class="z" x="325" y="404" text-anchor="middle">Conv1d 16→24, k=9</text><text class="z" x="325" y="424" text-anchor="middle">stride 4 · GN · GELU</text><text class="m" x="325" y="449" text-anchor="middle">24 × 361</text>
<rect class="s" x="255" y="525" width="140" height="122" rx="8"/><text class="b" x="325" y="559" text-anchor="middle">Conv block 3</text><text class="z" x="325" y="584" text-anchor="middle">Conv1d 24→32, k=9</text><text class="z" x="325" y="604" text-anchor="middle">stride 2 · GN · GELU</text><text class="m" x="325" y="629" text-anchor="middle">32 × 181</text><text class="u" x="325" y="700" text-anchor="middle">Each block: same padding (4) → GroupNorm → GELU</text><path class="p" d="M217 228H255M325 287V345M325 467V525"/>
<rect class="r" x="475" y="112" width="360" height="385" rx="10"/><text class="k" x="495" y="143">CLICK ENCODER Eₓ (UNSHARED)</text><rect class="x" x="515" y="174" width="280" height="78" rx="8"/><text class="b" x="655" y="205" text-anchor="middle">Depthwise-separable temporal block</text><text class="z" x="655" y="229" text-anchor="middle">DW Conv1d 32→32, k=5 → PW Conv1d → GN → GELU</text><rect class="x" x="515" y="291" width="280" height="65" rx="8"/><text class="b" x="655" y="320" text-anchor="middle">Adaptive average pooling</text><text class="m" x="655" y="343" text-anchor="middle">32 × 181 → 32 × 1</text><rect class="x" x="515" y="394" width="280" height="70" rx="8"/><text class="b" x="655" y="422" text-anchor="middle">Flatten → Linear 32→64 → LayerNorm</text><text class="m" x="655" y="447" text-anchor="middle">zₓ ∈ ℝ⁶⁴</text><path class="p" d="M395 586H455V213H515M655 252V291M655 356V394"/>
<rect class="r" x="475" y="532" width="360" height="385" rx="10"/><text class="k" x="495" y="563">CHANNEL ENCODER Eₕ (UNSHARED)</text><rect class="h" x="515" y="594" width="280" height="78" rx="8"/><text class="b" x="655" y="625" text-anchor="middle">Depthwise-separable temporal block</text><text class="z" x="655" y="649" text-anchor="middle">DW Conv1d 32→32, k=5 → PW Conv1d → GN → GELU</text><rect class="h" x="515" y="711" width="280" height="65" rx="8"/><text class="b" x="655" y="740" text-anchor="middle">Adaptive average pooling</text><text class="m" x="655" y="763" text-anchor="middle">32 × 181 → 32 × 1</text><rect class="h" x="515" y="814" width="280" height="70" rx="8"/><text class="b" x="655" y="842" text-anchor="middle">Flatten → Linear 32→64 → LayerNorm</text><text class="m" x="655" y="867" text-anchor="middle">zₕ ∈ ℝ⁶⁴</text><path class="p" d="M395 586H455V633H515M655 672V711M655 776V814"/>
<rect class="r" x="875" y="112" width="535" height="385" rx="10"/><text class="k" x="895" y="143">CLICK DECODER Dₓ</text><rect class="x" x="905" y="174" width="150" height="80" rx="8"/><text class="b" x="980" y="205" text-anchor="middle">Seed projection</text><text class="z" x="980" y="228" text-anchor="middle">Linear 64→32×181</text><text class="m" x="980" y="247" text-anchor="middle">32 × 181</text><rect class="x" x="1090" y="174" width="280" height="80" rx="8"/><text class="b" x="1230" y="203" text-anchor="middle">Five progressive decoding stages</text><text class="z" x="1230" y="226" text-anchor="middle">linear interpolation → depthwise-separable Conv → GN → GELU</text><text class="m" x="1230" y="247" text-anchor="middle">32×181 → 16×361 → 8×721 → 8×1441 → 8×2881 → 8×5761</text><rect class="x" x="905" y="303" width="220" height="74" rx="8"/><text class="b" x="1015" y="333" text-anchor="middle">Output projection</text><text class="z" x="1015" y="356" text-anchor="middle">Conv1d 8→1, k=1 → tanh</text><rect class="n" x="1170" y="303" width="200" height="74" rx="8"/><text class="b" x="1270" y="333" text-anchor="middle">Click estimate</text><text class="m" x="1270" y="357" text-anchor="middle">x̂ ∈ ℝ⁵⁷⁶¹</text><rect class="x" x="905" y="410" width="220" height="57" rx="8"/><text class="b" x="1015" y="435" text-anchor="middle">Classifier: Linear 64→1</text><text class="m" x="1015" y="455" text-anchor="middle">ℓ = C(zₓ)</text><rect class="n" x="1170" y="410" width="200" height="57" rx="8"/><text class="b" x="1270" y="435" text-anchor="middle">Click probability</text><text class="m" x="1270" y="455" text-anchor="middle">p = σ(ℓ)</text><path class="p" d="M795 429H870V214H905M1055 214H1090M1230 254V285H1015V303M1125 340H1170M795 429H905V438M1125 438H1170"/>
<rect class="r" x="875" y="532" width="535" height="385" rx="10"/><text class="k" x="895" y="563">CAUSAL CHANNEL DECODER Dₕ</text><rect class="h" x="905" y="594" width="150" height="80" rx="8"/><text class="b" x="980" y="625" text-anchor="middle">Seed projection</text><text class="z" x="980" y="648" text-anchor="middle">Linear 64→16×181</text><text class="m" x="980" y="667" text-anchor="middle">16 × 181</text><rect class="h" x="1090" y="594" width="280" height="80" rx="8"/><text class="b" x="1230" y="623" text-anchor="middle">Four progressive decoding stages</text><text class="z" x="1230" y="646" text-anchor="middle">linear interpolation → depthwise-separable Conv → GN → GELU</text><text class="m" x="1230" y="667" text-anchor="middle">16×181 → 8×360 → 8×720 → 8×1440 → 8×2880</text><rect class="h" x="905" y="723" width="220" height="74" rx="8"/><text class="b" x="1015" y="753" text-anchor="middle">Tail projection</text><text class="z" x="1015" y="776" text-anchor="middle">Conv1d 8→1, k=1 → 0.25 tanh</text><rect class="n" x="1170" y="723" width="200" height="74" rx="8"/><text class="b" x="1270" y="753" text-anchor="middle">Causal channel estimate</text><text class="m" x="1270" y="776" text-anchor="middle">ĥ = [1, ĥ₁:₂₈₈₀]</text><text class="u" x="1270" y="815" text-anchor="middle">unit direct path prepended; length = 2881 (≈5 ms)</text><path class="p" d="M795 849H870V634H905M1055 634H1090M1230 674V705H1015V723M1125 760H1170"/>
<rect class="r" x="1450" y="112" width="500" height="805" rx="10"/><text class="k" x="1470" y="143">RECONSTRUCTION AND TRAINING SIGNALS</text><rect class="o" x="1510" y="236" width="175" height="86" rx="8"/><text class="b" x="1598" y="269" text-anchor="middle">Causal FFT convolution</text><text class="m" x="1598" y="297" text-anchor="middle">r̂ = x̂ ∗ ĥ</text><rect class="n" x="1730" y="236" width="170" height="86" rx="8"/><text class="b" x="1815" y="269" text-anchor="middle">Reconstruction</text><text class="m" x="1815" y="297" text-anchor="middle">r̂ ∈ ℝ⁵⁷⁶¹</text><rect class="l" x="1510" y="415" width="175" height="75" rx="8"/><text class="b" x="1598" y="445" text-anchor="middle">Reconstruction loss</text><text class="m" x="1598" y="471" text-anchor="middle">Lrecon(r, r̂)</text><rect class="l" x="1730" y="415" width="170" height="75" rx="8"/><text class="b" x="1815" y="445" text-anchor="middle">Classification loss</text><text class="m" x="1815" y="471" text-anchor="middle">LBCE(ℓ, y)</text><rect class="l" x="1510" y="572" width="390" height="105" rx="8"/><text class="b" x="1705" y="604" text-anchor="middle">Optional positive-only representation constraint</text><text class="m" x="1705" y="634" text-anchor="middle">LMIM (v3) or λorth Lorth (v4)</text><text class="z" x="1705" y="657" text-anchor="middle">applied only to paired zₓ, zₕ from real click samples</text><rect class="n" x="1510" y="747" width="390" height="86" rx="8"/><text class="b" x="1705" y="780" text-anchor="middle">Training objective</text><text class="m" x="1705" y="810" text-anchor="middle">L = Lrecon + LBCE + Lconstraint</text><path class="p" d="M1370 340H1510V279M1370 760H1440V303H1510M1685 279H1730M1598 490V747M1815 490V747M1705 677V747"/><path class="q" d="M1815 322V390H1598V415M1270 467H1430V390H1815V415M655 464V535H1705V572M655 884V535H1705V572"/><text class="u" x="1705" y="866" text-anchor="middle">At inference: Eₓ → Dₓ classifier produces p(y = 1 | r); reconstruction branches shape the learned representation.</text>
</svg>