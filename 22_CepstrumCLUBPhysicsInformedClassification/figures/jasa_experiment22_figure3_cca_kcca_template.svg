<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
<title id="title">CCA and KCCA spectrum template</title><desc id="desc">Editable placeholder for positive and all-sample canonical-correlation spectra and paired bootstrap differences.</desc>
<style>.bg{fill:#fff}.axis{stroke:#222;stroke-width:2}.grid{stroke:#ddd;stroke-width:1}.t{font:700 25px Arial,sans-serif;fill:#222}.h{font:700 18px Arial,sans-serif;fill:#222}.s{font:15px Arial,sans-serif;fill:#333}.tiny{font:13px Arial,sans-serif;fill:#555}.blue{stroke:#0072B2;fill:none;stroke-width:3}.orange{stroke:#D55E00;fill:none;stroke-width:3}.gray{stroke:#666;fill:none;stroke-width:2;stroke-dasharray:5 4}.placeholder{font:700 18px Arial,sans-serif;fill:#888}</style>
<rect class="bg" width="1600" height="950"/><text class="t" x="55" y="48">Figure 3. X/H latent-dependence spectra and paired differences</text><text class="s" x="55" y="76">Template only. Populate from matched 3-seed × 5-fold OOF latent vectors and source-level bootstrap.</text>
<g id="positive_spectra"><text class="h" x="85" y="124">A. Positive samples</text><line class="axis" x1="115" y1="400" x2="720" y2="400"/><line class="axis" x1="115" y1="160" x2="115" y2="400"/><g class="grid"><line x1="115" y1="220" x2="720" y2="220"/><line x1="115" y1="280" x2="720" y2="280"/><line x1="115" y1="340" x2="720" y2="340"/></g><text class="tiny" x="65" y="170">1.0</text><text class="tiny" x="65" y="230">0.75</text><text class="tiny" x="65" y="290">0.50</text><text class="tiny" x="65" y="350">0.25</text><text class="tiny" x="70" y="410">0</text><text class="s" x="300" y="440">Canonical component (1–10)</text><text class="s" transform="translate(30 345) rotate(-90)">Canonical correlation</text><path class="blue" d="M145 360 L205 350 L265 340 L325 330 L385 320 L445 310 L505 300 L565 290 L625 280 L685 270"/><path class="orange" d="M145 365 L205 355 L265 345 L325 335 L385 325 L445 315 L505 305 L565 295 L625 285 L685 275"/><text class="placeholder" x="310" y="265">TBD: replace paths with observed spectra</text><line class="blue" x1="450" y1="125" x2="490" y2="125"/><text class="tiny" x="498" y="130">Final condition</text><line class="orange" x1="585" y1="125" x2="625" y2="125"/><text class="tiny" x="633" y="130">Matched control</text></g>
<g id="all_spectra"><text class="h" x="875" y="124">B. All OOF samples</text><line class="axis" x1="905" y1="400" x2="1510" y2="400"/><line class="axis" x1="905" y1="160" x2="905" y2="400"/><g class="grid"><line x1="905" y1="220" x2="1510" y2="220"/><line x1="905" y1="280" x2="1510" y2="280"/><line x1="905" y1="340" x2="1510" y2="340"/></g><text class="s" x="1090" y="440">Canonical component (1–10)</text><text class="s" transform="translate(820 345) rotate(-90)">Canonical correlation</text><path class="blue" d="M935 360 L995 350 L1055 340 L1115 330 L1175 320 L1235 310 L1295 300 L1355 290 L1415 280 L1475 270"/><path class="orange" d="M935 365 L995 355 L1055 345 L1115 335 L1175 325 L1235 315 L1295 305 L1355 295 L1415 285 L1475 275"/><text class="placeholder" x="1100" y="265">TBD: replace paths with observed spectra</text></g>
<g id="paired_difference"><text class="h" x="85" y="515">C. Paired difference, final condition − matched control</text><line class="axis" x1="115" y1="765" x2="1510" y2="765"/><line class="gray" x1="115" y1="645" x2="1510" y2="645"/><text class="tiny" x="58" y="650">0</text><text class="tiny" x="130" y="805">1</text><text class="tiny" x="270" y="805">2</text><text class="tiny" x="410" y="805">3</text><text class="tiny" x="550" y="805">4</text><text class="tiny" x="690" y="805">5</text><text class="tiny" x="830" y="805">6</text><text class="tiny" x="970" y="805">7</text><text class="tiny" x="1110" y="805">8</text><text class="tiny" x="1250" y="805">9</text><text class="tiny" x="1390" y="805">10</text><text class="s" x="650" y="842">Canonical component</text><text class="s" transform="translate(30 745) rotate(-90)">Paired difference with 95% CI</text><g fill="#0072B2" stroke="#0072B2"><line x1="150" y1="620" x2="150" y2="690"/><circle cx="150" cy="655" r="6"/><line x1="290" y1="620" x2="290" y2="690"/><circle cx="290" cy="655" r="6"/><line x1="430" y1="620" x2="430" y2="690"/><circle cx="430" cy="655" r="6"/></g><text class="placeholder" x="660" y="670">TBD: plot all components and source-bootstrap intervals</text><text class="tiny" x="115" y="895">Lower correlation supports weaker statistical dependence only; it does not establish independence, causal disentanglement, or a true propagation channel.</text></g>
</svg>
